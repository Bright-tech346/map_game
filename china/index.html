<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>点亮中国 · 省份版</title>
<style>
:root{
  --bg:#0a111c; --panel:#101a29; --line:#22324a; --ink:#e9eef6; --mute:#8496b0;
  --land:#18263a; --cityline:#26374f; --provline:#4f6888;
  --lit:#ffb240;--go:#3ecf8e; --lit2:#ff7a2f; --miss:#ff5c6c; --ok:#5fd39a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;overflow:hidden}
.app{display:flex;height:100%}
.mapwrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 55% 45%,#13213a 0%,#0a111c 70%)}
svg#map{width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
svg#map.drag{cursor:grabbing}
.c{fill:var(--land);stroke:var(--provline);stroke-width:1;stroke-linejoin:round;vector-effect:non-scaling-stroke;transition:fill .5s}
.c:hover{fill:#22344e}
.c.lit{fill:var(--lit);stroke:#ffd38a}
.c.lit:hover{fill:#ffc56a}
.c.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{fill:#fff}25%{fill:#fff3c4}100%{fill:var(--lit)}}
.reveal .c:not(.lit){fill:#3a2030;stroke:#5a2d3f}
.p{fill:none;stroke:var(--provline);stroke-width:1.1;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.inset{fill:none;stroke:var(--provline);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 3}
.lab{fill:#3b2304;font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:rgba(255,215,140,.6);stroke-linejoin:round;display:none}
.lab.on{display:block}
.reveal .lab.rv{display:block;fill:#ffb3bd;stroke:rgba(20,8,14,.8)}
.ring{fill:none;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none;opacity:0}
.ring.go{animation:ring 1.3s ease-out}
@keyframes ring{0%{opacity:1;stroke-width:3}100%{opacity:0;stroke-width:0}}

.title{position:absolute;left:22px;top:18px;pointer-events:none}
.title h1{font-family:"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif;font-size:30px;letter-spacing:.12em;font-weight:900;color:#fff}
.title p{color:var(--mute);font-size:12px;letter-spacing:.18em;margin-top:2px;text-transform:uppercase}
.zoom{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(16,26,41,.85);color:var(--ink);font-size:18px;cursor:pointer}
.zoom button:hover{border-color:var(--provline)}
.tip{position:absolute;pointer-events:none;background:rgba(8,14,24,.92);border:1px solid var(--line);padding:6px 10px;border-radius:7px;font-size:13px;white-space:nowrap;display:none;transform:translate(-50%,-130%)}
.tip b{color:var(--lit)}
.tip span{color:var(--mute);margin-left:6px;font-size:12px}

.side{width:360px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.head{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.inp{display:flex;gap:8px}
.inp input{flex:1;min-width:0;height:48px;border-radius:10px;border:1.5px solid var(--line);background:#0a121e;color:var(--ink);font-size:20px;padding:0 14px;outline:none;font-family:inherit}
.inp input:focus{border-color:var(--lit)}
.inp button{height:48px;padding:0 18px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--lit),var(--lit2));color:#2a1500;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.msg{height:22px;margin-top:10px;font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--miss)}.msg.dup{color:var(--lit)}
.score{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px}
.score .big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.score .big small{font-size:16px;color:var(--mute);font-weight:500}
.score .pct{color:var(--lit);font-weight:700;font-size:18px}
.bar{height:6px;border-radius:3px;background:#0a121e;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lit2),var(--lit));transition:width .6s}
.tabs{display:flex;padding:0 20px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:none;color:var(--mute);padding:12px 0;font-size:14px;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}
.tabs button.on{color:var(--ink);border-bottom-color:var(--lit)}
.list{flex:1;overflow:auto;padding:8px 12px 12px;min-height:0}
.list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.prow:hover{background:#16233a}
.prow .nm{font-size:14px}
.prow .ct{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.prow.done .nm{color:var(--lit)}
.prow .pb{grid-column:1/3;height:3px;background:#0a121e;border-radius:2px;overflow:hidden}
.prow .pb i{display:block;height:100%;background:var(--lit)}
.chips{display:none;grid-column:1/3;flex-wrap:wrap;gap:5px;margin-top:6px}
.prow.open .chips{display:flex}
.chip{font-size:12px;padding:2px 8px;border-radius:10px;background:#0a121e;color:#4a5b75;border:1px solid var(--line)}
.chip.y{color:#2a1500;background:var(--lit);border-color:var(--lit)}
.frow{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;font-size:14px;cursor:pointer}
.frow:hover{background:#16233a}
.frow span{color:var(--mute);font-size:12px}
.empty{color:var(--mute);font-size:13px;padding:20px 10px;line-height:1.7}
.foot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.foot button{flex:1;height:36px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font-size:13px;font-family:inherit}
.foot button:hover{border-color:var(--provline)}
.foot button.warn{border-color:var(--miss);color:var(--miss)}
.win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,9,16,.6);backdrop-filter:blur(3px)}
.win.show{display:flex}
.win div{background:var(--panel);border:1px solid var(--lit);border-radius:16px;padding:30px 40px;text-align:center}
.win h2{font-size:28px;color:var(--lit);margin-bottom:8px}
.win button{margin-top:16px;padding:8px 20px;border-radius:8px;border:none;background:var(--lit);font-weight:700;cursor:pointer}
/* mode switch + route mode */
.modes{display:flex;background:#0a121e;border-radius:10px;padding:3px;margin-bottom:14px}
.modes button{flex:1;border:none;background:none;color:var(--mute);padding:8px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit}
.modes button.on{background:#1d2c44;color:var(--ink);font-weight:600}
#route{display:none;flex:1;flex-direction:column;min-height:0;overflow:auto;padding:16px 20px}
body.route #route{display:flex}
body.route .tabs,body.route .list,body.route .foot,body.route .score,body.route .bar{display:none}
.ends{display:flex;align-items:center;gap:8px}
.end{flex:1;border-radius:10px;padding:10px 12px;background:#0a121e;border:1px solid var(--line)}
.end small{display:block;font-size:11px;color:var(--mute);letter-spacing:.1em}
.end b{font-size:20px}
.end.s b{color:var(--go)}.end.m b{color:#8fa8ff}
body:not(.r3) #rMbox,body:not(.r3) #rMarr{display:none}
body.r3 .end{padding:9px 10px}body.r3 .end b{font-size:17px}
.trail .st.m{background:#6c8cff;color:#0b1433}
body.route .c.rm{fill:#6c8cff;stroke:#d0dbff;animation:midp 1.6s ease-in-out infinite}
body.route .c.rm.vis{animation:none;fill:#4f6bd8}
@keyframes midp{50%{fill:#a4b8ff}}.end.e b{color:var(--miss)}
.arrow{color:var(--mute);font-size:18px}
.rstats{display:flex;gap:6px;margin-top:10px}
.rstats div{flex:1;text-align:center;background:#0a121e;border-radius:8px;padding:7px 4px}
.rstats small{display:block;font-size:11px;color:var(--mute)}
.rstats b{font-size:17px;font-variant-numeric:tabular-nums}
.trail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;font-size:14px}
.trail .st{padding:3px 10px;border-radius:12px;background:#1d2c44}
.trail .st.s{background:var(--go);color:#062b18}
.trail .st.e{background:var(--miss);color:#2b0610}
.trail .st.c{box-shadow:0 0 0 2px var(--lit)}
.trail i{color:var(--mute);font-style:normal;font-size:12px}
.result{margin-top:14px;padding:14px;border-radius:10px;border:1px solid var(--lit);background:rgba(255,178,64,.08);display:none}
.result.show{display:block}
.result h3{color:var(--lit);font-size:18px}
.result p{font-size:13px;margin-top:6px;line-height:1.7}
.chk{font-size:13px;color:var(--mute);margin-top:14px;display:flex;align-items:center;gap:6px;cursor:pointer}
.rhelp{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.7}
.rbtns{display:flex;gap:8px;margin-top:auto;padding-top:14px}
.rbtns button{flex:1;height:38px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--ink);cursor:pointer;font-size:13px;font-family:inherit}
.rbtns button:hover{border-color:var(--provline)}
.rbtns .pri{background:linear-gradient(135deg,var(--lit),var(--lit2));color:#2a1500;border:none;font-weight:700}
body.route .c.lit{fill:var(--land);stroke:var(--provline)}
body.route .c:hover{fill:#22344e}
body.route .c.rp{fill:#a8762c;stroke:#ffd38a}
body.route .c.rc{fill:var(--lit);stroke:#fff}
body.route .c.rs{fill:var(--go);stroke:#b6f5d3}
body.route .c.re{fill:var(--miss);stroke:#ffc0c7;animation:endp 1.6s ease-in-out infinite}
body.route.fin .c.re{animation:none}
@keyframes endp{50%{fill:#ff9aa4}}
body.route .c.flash{animation:none}
body.route .c.badf{animation:badf .9s}
@keyframes badf{0%,50%{fill:#8a2c3a}}
body.route .lab{display:none}
body.route .lab.ro{display:block}
body.route.names .lab{display:block}
body.route.names .lab:not(.ro){fill:#b9c6da;stroke:rgba(10,17,28,.85)}
.tline{fill:none;stroke:#fff;stroke-width:2.2;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;opacity:.9;display:none}
.oline{fill:none;stroke:var(--go);stroke-width:2.5;stroke-dasharray:1 6;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none;display:none}
body.route .tline,body.route .oline{display:block}
@media (max-width:760px){
  .app{flex-direction:column-reverse}
  .side{width:100%;height:46%;border-left:none;border-top:1px solid var(--line)}
  .head{padding:12px 14px 10px}.score{margin-top:6px}.score .big{font-size:24px}
  .title h1{font-size:20px}.title{left:14px;top:12px}
  .tabs{padding:0 14px}.tabs button{padding:8px 0}
  .foot{padding:8px 14px}
}
</style>
</head>
<body>
<div class="app">
  <div class="mapwrap" id="wrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg">
      <g id="gc"></g><g id="gp"></g><g id="gx"></g><g id="gl"></g>
    </svg>
    <div class="title"><h1>点亮中国</h1><p>Light up every province</p></div>
    <div class="zoom"><button id="zin" title="放大">+</button><button id="zout" title="缩小">−</button><button id="zhome" title="全图" style="font-size:14px">⌂</button></div>
    <div class="tip" id="tip"></div>
    <div class="win" id="win"><div><h2>全部点亮！</h2><p id="wintext"></p><button id="winok">太棒了</button></div></div>
  </div>
  <aside class="side">
    <div class="head">
      <div class="modes"><button class="on" data-m="free">自由模式</button><button data-m="route">A → B</button><button data-m="route3">A → B → C</button></div>
      <form class="inp" id="form" autocomplete="off">
        <input id="q" placeholder="输入省份，如 湖北 / 上海" autofocus>
        <button type="button">点亮</button>
      </form>
      <div class="msg" id="msg">支持简体、繁体、拼音或简称（如 湖北、鄂、hubei）</div>
      <div class="score"><div class="big"><span id="cnt">0</span> <small>/ <span id="tot"></span></small></div><div class="pct" id="pct">0%</div></div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div id="route">
      <div class="ends"><div class="end s"><small>起点</small><b id="rS"></b></div><div class="arrow">→</div><div class="end m" id="rMbox"><small id="rMlab">中途站</small><b id="rM"></b></div><div class="arrow" id="rMarr">→</div><div class="end e"><small>终点</small><b id="rE"></b></div></div>
      <div class="rstats"><div><small>目前位置</small><b id="rCur"></b></div><div><small>步数</small><b id="rSteps"></b></div><div><small>最少</small><b id="rOpt"></b></div><div><small>错误</small><b id="rWrong"></b></div></div>
      <div class="trail" id="rTrail"></div>
      <div class="result" id="rRes"></div>
      <label class="chk"><input type="checkbox" id="rNames"> 在地图上显示所有省名（简单模式）</label>
      <div class="rhelp">每次输入一个与「目前位置」相邻的省份，就会移动过去。走到终点就过关（A → B → C 模式要先经过蓝色的中途站），步数越少越好。海南可经琼州海峡到广东。</div>
      <div class="rbtns"><button id="rHint">提示</button><button id="rGive">放弃</button><button id="rNew" class="pri">换一题</button></div>
    </div>
    <div class="tabs"><button class="on" data-t="prov">按地区</button><button data-t="recent">已点亮</button></div>
    <div class="list" id="list"></div>
    <div class="foot"><button id="reveal">显示答案</button><button id="reset">重新开始</button></div>
  </aside>
</div>

  let { x, y, w, h } = b;
  if (w / h > r) { const nh = w / r; y -= (nh - h) / 2; h = nh; } else { const nw = h * r; x -= (nw - w) / 2; w = nw; }
  return { x, y, w, h };
}
function apply() {
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  scheduleLabels();
}
const ppu = () => svg.clientWidth / vb.w; // pixels per svg unit
let anim = null;
function flyTo(b, ms = 700) {
  const to = fit(b), from = { ...vb }, t0 = performance.now();
  cancelAnimationFrame(anim);
  const step = t => {
    let k = Math.min(1, (t - t0) / ms); k = 1 - Math.pow(1 - k, 3);
    for (const p of ['x', 'y', 'w', 'h']) vb[p] = from[p] + (to[p] - from[p]) * k;
    apply(); if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function zoomAt(f, px, py) {
  const r = svg.getBoundingClientRect();
  const ux = vb.x + (px - r.left) / r.width * vb.w, uy = vb.y + (py - r.top) / r.height * vb.h;
  const nw = Math.min(Math.max(vb.w * f, 15), HOME.w * 2.5); f = nw / vb.w;
  vb = { x: ux - (ux - vb.x) * f, y: uy - (uy - vb.y) * f, w: vb.w * f, h: vb.h * f };
  apply();
}
svg.addEventListener('wheel', e => { e.preventDefault(); cancelAnimationFrame(anim); zoomAt(Math.exp(e.deltaY * 0.0015), e.clientX, e.clientY); }, { passive: false });
const ptrs = new Map(); let pinch = null, moved = false;
svg.addEventListener('pointerdown', e => { svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = false; cancelAnimationFrame(anim); if (ptrs.size === 1) svg.classList.add('drag'); });
svg.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return showTip(e);
  const prev = ptrs.get(e.pointerId), cur = { x: e.clientX, y: e.clientY };
  if (ptrs.size === 1) {
    const dx = cur.x - prev.x, dy = cur.y - prev.y;
    if (Math.abs(dx) + Math.abs(dy) > 1) moved = true;
    const k = vb.w / svg.clientWidth; vb.x -= dx * k; vb.y -= dy * k; apply();
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.entries()].map(([id, p]) => id === e.pointerId ? cur : p);
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch) zoomAt(pinch / d, (a.x + b.x) / 2, (a.y + b.y) / 2);
    pinch = d; moved = true;
  }
  ptrs.set(e.pointerId, cur);
  $('tip').style.display = 'none';
});
const up = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null; if (!ptrs.size) svg.classList.remove('drag'); };
svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up);
svg.addEventListener('pointerleave', () => $('tip').style.display = 'none');
$('zin').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(0.6, r.left + r.width / 2, r.top + r.height / 2); };
$('zout').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(1 / 0.6, r.left + r.width / 2, r.top + r.height / 2); };
$('zhome').onclick = () => flyTo(HOME);
window.addEventListener('resize', () => { vb = fit(vb); apply(); });

// labels: size to zoom, hide when region too small on screen
let labRaf = 0;
function scheduleLabels() { if (!labRaf) labRaf = requestAnimationFrame(() => { labRaf = 0; updateLabels(); }); }
function updateLabels() {
  const k = ppu();
  gl.setAttribute('font-size', (12 / k).toFixed(2));
  gl.style.strokeWidth = (2.5 / k) + 'px';
  const revealing = document.body.classList.contains('reveal');
  C.forEach(c => {
    const big = c.r * k > c.s.length * 11 + 4;
    c.lab.style.visibility = big ? 'visible' : 'hidden';
  });
}

// tooltip
function showTip(e) {
  const t = e.target, tip = $('tip');
  if (!t.classList || !t.classList.contains('c')) { tip.style.display = 'none'; return; }
  const c = C[t.dataset.i], r = $('wrap').getBoundingClientRect();
  const B = document.body.classList;
  const known = mode.startsWith('route')
    ? (B.contains('names') || R.path.includes(c) || c === R.e || c === R.m || (R.gave && optPath().includes(c)))
    : (found.has(c.n) || B.contains('reveal'));
  tip.innerHTML = known ? `<b>${c.n}</b><span>${c.p}</span>` : `？？？<span>${c.p}</span>`;
  tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; tip.style.display = 'block';
}

// ---------- game state ----------
let found = new Map(); // name -> timestamp
const KEY = 'lightup-china-prov-v1';
try { const s = JSON.parse(localStorage.getItem(KEY) || '[]'); s.forEach(([n, t]) => { if (C.some(c => c.n === n)) found.set(n, t); }); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...found])); } catch (e) {} };

function light(c, fresh) {
  c.els.forEach(e => e.classList.add('lit')); c.lab.classList.add('on'); c.lab.classList.remove('rv');
  if (fresh) c.els.forEach(e => { e.classList.remove('flash'); void e.getBBox(); e.classList.add('flash'); });
}
function pulse(c) {
  const bb = c.el.getBBox();
  ring.setAttribute('cx', c.x); ring.setAttribute('cy', c.y);
  ring.setAttribute('r', Math.max(bb.width, bb.height) / 2 + 6 / ppu());
  ring.classList.remove('go'); void ring.getBBox(); ring.classList.add('go');
  c.els.forEach(e => { e.classList.remove('flash'); void e.getBBox(); e.classList.add('flash'); });
}
function focusCity(c) {
  const bb = c.el.getBBox(), k = ppu();
  const onScreen = bb.x + bb.width > vb.x && bb.x < vb.x + vb.w && bb.y + bb.height > vb.y && bb.y < vb.y + vb.h;
  const tooSmall = Math.max(bb.width, bb.height) * k < 22;
  if (!onScreen || tooSmall) {
    const pad = Math.max(bb.width, bb.height) * 2.5 + 40;
    flyTo({ x: bb.x + bb.width / 2 - pad / 2, y: bb.y + bb.height / 2 - pad / 2, w: pad, h: pad });
  }
}
function setMsg(t, cls) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const q = $('q'), v = q.value.trim(); if (!v) return;
  const hits = lookup(v);
  if (mode.startsWith('route')) { if (hits.length) routeMove(hits[0]); else { setMsg(`找不到「${v}」`, 'bad'); shake(); } return; }
  if (!hits.length) {
    setMsg(`找不到「${v}」这个省级行政区`, 'bad');
    q.classList.remove('shake'); void q.offsetWidth; q.classList.add('shake');
    q.select(); return;
  }
  const fresh = hits.filter(c => !found.has(c.n));
  fresh.forEach(c => { found.set(c.n, Date.now()); light(c, true); });
  hits.forEach(pulse);
  if (fresh.length) {
    setMsg('✓ ' + fresh.map(c => `${c.n} · ${c.p}`).join('，'), 'ok');
    save(); refresh();
  } else setMsg(`「${hits.map(c => c.n).join('、')}」已经点亮了`, 'dup');
  if (hits.length === 1) focusCity(hits[0]);
  q.value = '';
  if (fresh.length && found.size === N) { $('wintext').textContent = `你点亮了全部 ${N} 个省级行政区！`; $('win').classList.add('show'); }
});
// Sandboxed viewers block form submission entirely, so drive it ourselves (and respect IME composition)
const doSubmit = () => $('form').dispatchEvent(new Event('submit', { cancelable: true }));
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!e.isComposing && e.keyCode !== 229) doSubmit(); } });
$('form').querySelector('button').addEventListener('click', e => { e.preventDefault(); doSubmit(); $('q').focus(); });
$('winok').onclick = () => $('win').classList.remove('show');

// ---------- side panel ----------
let tab = 'prov'; const open = new Set();
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b)); tab = b.dataset.t; renderList();
});
function refresh() {
  const n = found.size;
  $('cnt').textContent = n; $('pct').textContent = Math.round(n / N * 100) + '%'; $('bar').style.width = (n / N * 100) + '%';
  renderList();
}
function provBox(p) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  p.cities.forEach(c => { if (c.n === '三沙市') return; const b = c.el.getBBox(); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height); });
  const w = x1 - x0, h = y1 - y0, m = Math.max(w, h) * 0.15 + 8;
  return { x: x0 - m, y: y0 - m, w: w + 2 * m, h: h + 2 * m };
}
function renderList() {
  const L = $('list'); L.innerHTML = '';
  const reveal = document.body.classList.contains('reveal');
  if (tab === 'prov') {
    PROVS.forEach(p => {
      const k = p.cities.filter(c => found.has(c.n)).length, tot = p.cities.length;
      const row = document.createElement('div');
      row.className = 'prow' + (k === tot ? ' done' : '') + (open.has(p.name) ? ' open' : '');
      row.innerHTML = `<div class="nm">${p.name === '港澳台' ? '港澳台' : p.name + '地区'}</div><div class="ct">${k} / ${tot}</div><div class="pb"><i style="width:${k / tot * 100}%"></i></div>
        <div class="chips">${p.cities.map(c => `<span class="chip ${found.has(c.n) ? 'y' : ''}">${found.has(c.n) || reveal ? c.s : '？'.repeat(Math.min(c.s.length, 4))}</span>`).join('')}</div>`;
      row.onclick = () => { open.has(p.name) ? open.delete(p.name) : open.add(p.name); row.classList.toggle('open'); flyTo(provBox(p)); };
      L.appendChild(row);
    });
  } else {
    const arr = [...found].sort((a, b) => b[1] - a[1]);
    if (!arr.length) { L.innerHTML = '<div class="empty">还没有点亮任何省份。<br>试试在上方输入「湖北」「上海」「西藏」……</div>'; return; }
    arr.forEach(([n]) => {
      const c = C.find(x => x.n === n), row = document.createElement('div');
      row.className = 'frow'; row.innerHTML = `${c.n}<span>${c.b} · ${c.p}</span>`;
      row.onclick = () => { pulse(c); const bb = c.el.getBBox(), pad = Math.max(bb.width, bb.height) * 2.5 + 40; flyTo({ x: bb.x + bb.width / 2 - pad / 2, y: bb.y + bb.height / 2 - pad / 2, w: pad, h: pad }); };
      L.appendChild(row);
    });
  }
}
$('reveal').onclick = () => {
  const on = document.body.classList.toggle('reveal');
  $('reveal').textContent = on ? '隐藏答案' : '显示答案';
  renderList(); updateLabels();
};
let resetArm = 0;
$('reset').onclick = () => {
  const b = $('reset');
  if (!resetArm) { b.textContent = '确定重置？'; b.classList.add('warn'); resetArm = setTimeout(() => { resetArm = 0; b.textContent = '重新开始'; b.classList.remove('warn'); }, 3000); return; }
  clearTimeout(resetArm); resetArm = 0; b.textContent = '重新开始'; b.classList.remove('warn');
  found.clear(); save();
  C.forEach(c => { c.els.forEach(e => e.classList.remove('lit', 'flash')); c.lab.classList.remove('on'); c.lab.classList.add('rv'); });
  setMsg('已重置，重新开始吧'); refresh(); flyTo(HOME); $('q').focus();
};

// ---------- 从 A 到 B ----------
let mode = 'free';
const R = { s: null, e: null, m: null, vm: false, kind: '', path: [], opt: 0, wrong: 0, hints: 0, done: false, gave: false };
const optPath = () => R.m ? bfsPath(R.s, R.m).concat(bfsPath(R.m, R.e).slice(1)) : bfsPath(R.s, R.e);
function shake() { const q = $('q'); q.classList.remove('shake'); void q.offsetWidth; q.classList.add('shake'); q.select(); }
function bfs(a) {
  const D = new Array(N).fill(Infinity), prev = new Array(N).fill(-1); D[a.id] = 0; const Q = [a.id];
  while (Q.length) { const u = Q.shift(); C[u].nb.forEach(v => { if (D[v] === Infinity) { D[v] = D[u] + 1; prev[v] = u; Q.push(v); } }); }
  return { D, prev };
}
function bfsPath(a, b) { const { prev } = bfs(a); const p = [b]; while (p[0] !== a) p.unshift(C[prev[p[0].id]]); return p; }
function boxOf(list) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  list.forEach(c => { const b = c.el.getBBox(); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.width); y1 = Math.max(y1, b.y + b.height); });
  const m = Math.max(x1 - x0, y1 - y0) * 0.12 + 20;
  return { x: x0 - m, y: y0 - m, w: x1 - x0 + 2 * m, h: y1 - y0 + 2 * m };
}
const RC = ['rs', 're', 'rm', 'vis', 'rp', 'rc', 'badf', 'flash'];
function clearRouteMap() {
  C.forEach(c => { c.els.forEach(e => e.classList.remove(...RC)); c.lab.classList.remove('ro'); });
  tline.setAttribute('points', ''); oline.setAttribute('points', '');
}
function newRound() {
  const three = mode === 'route3';
  let s, e, m = null, d;
  for (let k = 0; k < 2000; k++) {
    s = C[Math.floor(Math.random() * N)];
    const Ds = bfs(s).D;
    if (!three) {
      const cand = C.filter(c => Ds[c.id] >= 3 && Ds[c.id] <= 7);
      if (!cand.length) continue;
      e = cand[Math.floor(Math.random() * cand.length)]; d = Ds[e.id]; break;
    }
    // A→B→C: B is 2–5 steps from A, C is 2–5 steps from B, and B must be a real detour
    const mids = C.filter(c => Ds[c.id] >= 2 && Ds[c.id] <= 5);
    if (!mids.length) continue;
    m = mids[Math.floor(Math.random() * mids.length)];
    const Dm = bfs(m).D;
    const ends = C.filter(c => c !== s && Dm[c.id] >= 2 && Dm[c.id] <= 5 && Ds[m.id] + Dm[c.id] > Ds[c.id] && Ds[c.id] >= 2);
    if (!ends.length) continue;
    e = ends[Math.floor(Math.random() * ends.length)]; d = Ds[m.id] + Dm[e.id]; break;
  }
  Object.assign(R, { s, e, m, vm: false, kind: mode, opt: d, path: [s], wrong: 0, hints: 0, done: false, gave: false });
  setMsg(startMsg(), '');
  renderRoute(); flyTo(boxOf(m ? [s, m, e] : [s, e]));
  $('q').value = ''; $('q').focus();
}
const startMsg = () => R.m ? `从「${R.s.s}」出发，先经过「${R.m.s}」，再走到「${R.e.s}」！` : `从「${R.s.s}」出发，走到「${R.e.s}」！`;
function renderRoute() {
  clearRouteMap();
  const cur = R.path[R.path.length - 1];
  const opt = R.gave ? optPath() : [];
  R.path.forEach(c => { c.els.forEach(e => e.classList.add('rp')); c.lab.classList.add('ro'); });
  opt.forEach(c => c.lab.classList.add('ro'));
  cur.els.forEach(e => e.classList.add('rc'));
  if (R.m) { R.m.els.forEach(e => { e.classList.remove('rp', 'rc'); e.classList.add('rm'); e.classList.toggle('vis', R.vm); }); R.m.lab.classList.add('ro'); }
  [R.s, R.e].forEach((c, i) => { c.els.forEach(e => { e.classList.remove('rp', 'rc', 'rm', 'vis'); e.classList.add(i ? 're' : 'rs'); }); c.lab.classList.add('ro'); });
  document.body.classList.toggle('r3', !!R.m);
  if (R.m) { $('rM').textContent = R.m.s; $('rMlab').textContent = R.vm ? '中途站 ✓' : '中途站'; }
  tline.setAttribute('points', R.path.map(c => c.x + ',' + c.y).join(' '));
  oline.setAttribute('points', opt.map(c => c.x + ',' + c.y).join(' '));
  document.body.classList.toggle('fin', R.done);
  $('rS').textContent = R.s.s; $('rE').textContent = R.e.s; $('rCur').textContent = cur.s;
  $('rSteps').textContent = R.path.length - 1; $('rOpt').textContent = R.opt; $('rWrong').textContent = R.wrong;
  $('rTrail').innerHTML = R.path.map((c, i) => `<span class="st ${i === 0 ? 's' : ''} ${c === R.e ? 'e' : ''} ${c === R.m ? 'm' : ''} ${i === R.path.length - 1 && !R.done ? 'c' : ''}">${c.s}</span>`).join('<i>→</i>');
  const res = $('rRes');
  res.classList.toggle('show', R.done);
  if (R.done) {
    const steps = R.path.length - 1, best = optPath().map(c => c.s).join(' → ');
    if (R.gave) res.innerHTML = `<h3>最短路线</h3><p>${best}（${R.opt} 步）<br>地图上的绿色点线就是这条路线。</p>`;
    else {
      const stars = steps === R.opt && !R.wrong && !R.hints ? '★★★' : steps <= R.opt + 2 ? '★★☆' : '★☆☆';
      res.innerHTML = `<h3>${stars} 抵达${R.e.s}！</h3><p>${steps === R.opt ? '完美，走的是最短路线！' : `用了 ${steps} 步，最短只要 ${R.opt} 步。`}<br>错误 ${R.wrong} 次 · 提示 ${R.hints} 次` +
        (steps === R.opt ? '' : `<br>参考路线：${best}`) + '</p>';
    }
  }
}
function routeMove(c) {
  if (R.done) { setMsg('这一局结束了，按「换一题」再来一局', 'dup'); $('q').value = ''; return; }
  const cur = R.path[R.path.length - 1];
  if (c === cur) { setMsg(`你已经在「${c.s}」了`, 'dup'); $('q').value = ''; return; }
  if (!cur.nb.includes(c.id)) {
    R.wrong++; setMsg(`「${c.s}」和「${cur.s}」不相邻`, 'bad'); shake();
    c.els.forEach(e => { e.classList.remove('badf'); void e.getBBox(); e.classList.add('badf'); });
    $('rWrong').textContent = R.wrong; return;
  }
  R.path.push(c); $('q').value = '';
  if (R.m && c === R.m && !R.vm) { R.vm = true; setMsg(`📍 到达中途站「${c.s}」！接着前往「${R.e.s}」`, 'ok'); }
  else if (c === R.e && R.m && !R.vm) setMsg(`来到「${c.s}」，但还没经过中途站「${R.m.s}」！`, 'dup');
  else if (c === R.e) { R.done = true; setMsg(`🎉 抵达终点「${c.s}」！`, 'ok'); }
  else setMsg(`→ 来到「${c.s}」`, 'ok');
  renderRoute(); pulse(c); focusCity(c);
}
$('rHint').onclick = () => {
  if (R.done) return;
  const cur = R.path[R.path.length - 1], goal = R.m && !R.vm ? R.m : R.e;
  const nx = bfsPath(cur, goal)[1];
  R.hints++; setMsg(`提示：可以往「${nx.s}」走`, 'dup'); pulse(nx); focusCity(nx); $('q').focus();
};
$('rGive').onclick = () => { if (R.done) return; R.done = R.gave = true; setMsg('已显示最短路线', 'dup'); renderRoute(); flyTo(boxOf(optPath())); };
$('rNew').onclick = newRound;
$('rNames').onchange = e => { document.body.classList.toggle('names', e.target.checked); $('q').focus(); };
function setMode(m) {
  mode = m;
  const isRoute = m.startsWith('route');
  document.body.classList.toggle('route', isRoute);
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  if (isRoute) {
    if (document.body.classList.contains('reveal')) $('reveal').click();
    $('q').placeholder = '输入相邻的省份…';
    if (!R.s || R.kind !== m) newRound(); else { renderRoute(); flyTo(boxOf(R.m ? [R.s, R.m, R.e] : [R.s, R.e])); setMsg(startMsg()); }
  } else {
    clearRouteMap(); $('q').placeholder = '输入省份，如 湖北 / 上海';
    setMsg('支持简体、繁体、拼音或简称（如 湖北、鄂、hubei）'); flyTo(HOME);
  }
  $('q').value = ''; $('q').focus();
}
document.querySelectorAll('.modes button').forEach(b => b.onclick = () => setMode(b.dataset.m));

// init
C.forEach(c => { if (found.has(c.n)) light(c, false); });
vb = fit(HOME); apply(); refresh();
</script>
</body>
</html>
